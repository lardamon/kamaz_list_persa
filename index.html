<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140608"/>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Лист героя — Molten Dark</title>
</head>
<body>
  <div class="wrap">
    <div class="frame">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<div class="topbar">
        <button type="button" class="rules-btn" id="rulesBtn" aria-label="Формулы"></button>
        <div class="line"></div><div class="gem"></div><div class="line"></div>
<button type="button" class="lock unlocked" id="замок" aria-label="Замок (блокировка редактирования)"></button>
      </div>

      <div class="content">
        <!-- ВКЛАДКА: БОЙ -->
        <section id="page-boy" class="page active">
<!-- УРОВЕНЬ — без рамки, отдельным блоком -->
<div class="levelbar top-level">
  <div class="lvl-label">
    УРОВЕНЬ
    <button class="lvl-help" id="xpHelpBtn" type="button" aria-label="Таблица опыта">?</button>
  </div>
  <div class="lvl-ctrl">
    <button class="lvl-btn icon-minus lockable" id="уровень_минус" type="button"></button>
    <input id="уровень" class="lvl-input" type="text" value="2" inputmode="none" />
    <button class="lvl-btn icon-plus lockable" id="уровень_плюс" type="button"></button>
  </div>
</div>

<!-- КПИ + отдых — в одной панели -->
<div class="panel lite boy-kpi">
  <div class="panel-b">
    <div class="grid2">
      <div class="kpi icon-hp">
        <div class="k">ХП</div>
        <input id="хп_тек" class="field lockable" inputmode="numeric" value="28"/>
      </div>
      <div class="kpi icon-hpmax">
        <div class="k">ХП МАКС</div>
        <input id="хп_макс" class="field lockable" inputmode="numeric" value="40"/>
      </div>
    </div>

    <div style="height:8px"></div>

    <div class="grid3">
      <div class="kpi icon-thp">
        <div class="k">ВРЕМ. ХП</div>
        <input id="хп_врем" class="field lockable" inputmode="numeric" value="6"/>
      </div>
      <div class="kpi icon-ac">
        <div class="k">КД</div>
        <input id="кд" class="field lockable" inputmode="numeric" value="16"/>
      </div>
      <div class="kpi icon-speed">
        <div class="k">СКОРОСТЬ</div>
        <input id="скорость" class="field lockable" inputmode="numeric" value="30"/>
      </div>
    </div>

    <div style="height:8px"></div>

    <div class="grid3">
      <div class="kpi kpi-mini icon-init">
        <div class="k">ИНИЦ.</div>
        <div class="v" id="иниц_текст">+2</div>
      </div>
      <div class="kpi kpi-mini icon-prof">
        <div class="k">БОНУС МАСТ.</div>
        <div class="v" id="бм">+2</div>
      </div>
      <div class="kpi kpi-mini icon-insp">
        <div class="k">ВДОХНОВЕНИЕ</div>
        <input id="вдохновение" class="field lockable" inputmode="numeric" value="0"/>
      </div>
    </div>

    <div style="height:8px"></div>

    <div class="btn btn-wide btn-thin lockable" id="длинный_отдых">Длинный отдых</div>
  </div>
</div>

<div class="panel lite panel-nohead">
  <div class="panel-b">
    <div class="atk-head">
      <div>НАЗВАНИЕ</div>
      <div>БОНУС</div>
      <div>УРОН</div>
    </div>
    <div class="atk-rows" id="быстрые_атаки"></div>
  </div>
</div>
        </section>

        <!-- ВКЛАДКА: ХАРАКТЕРИСТИКИ -->
        <section id="page-har" class="page">
<div class="panel lite skills-panel">
            <div class="panel-h">
              <span>Характеристики</span>
              <span class="small">моды считаются автоматически</span>
            </div>
            <div class="panel-b">
              <div class="abilities">
                <div class="ability" data-abil="сила">
                  <div class="title">СИЛА</div>
                  <input class="ability-score lockable" id="сила_знач" inputmode="numeric" value="15" />
                  <div class="mod" id="сила_мод">+2</div>
                </div>
                <div class="ability" data-abil="ловкость">
                  <div class="title">ЛОВК</div>
                  <input class="ability-score lockable" id="ловк_знач" inputmode="numeric" value="14" />
                  <div class="mod" id="ловк_мод">+2</div>
                </div>
                <div class="ability" data-abil="телосложение">
                  <div class="title">ТЕЛ</div>
                  <input class="ability-score lockable" id="тело_знач" inputmode="numeric" value="14" />
                  <div class="mod" id="тело_мод">+2</div>
                </div>

                <div class="ability" data-abil="интеллект">
                  <div class="title">ИНТ</div>
                  <input class="ability-score lockable" id="инт_знач" inputmode="numeric" value="10" />
                  <div class="mod" id="инт_мод">+0</div>
                </div>
                <div class="ability" data-abil="мудрость">
                  <div class="title">МУДР</div>
                  <input class="ability-score lockable" id="мудр_знач" inputmode="numeric" value="12" />
                  <div class="mod" id="мудр_мод">+1</div>
                </div>
                <div class="ability" data-abil="харизма">
                  <div class="title">ХАР</div>
                  <input class="ability-score lockable" id="хар_знач" inputmode="numeric" value="8" />
                  <div class="mod" id="хар_мод">-1</div>
                </div>
              </div>
            </div>
          </div>

          <div class="panel lite">
            <div class="panel-h">
              <span>Навыки</span>
              <span class="small">профессия = + бонус мастерства</span>
            </div>
            <div class="panel-b">
              <div class="skills" id="список_навыков"></div>
            </div>
          </div>
        </section>

<!-- ВКЛАДКА: ИНВЕНТАРЬ -->
<section id="page-inv" class="page">
  <div class="panel lite">
    <div class="panel-b inv">
      <!-- ИКОНКИ-ВКЛАДКИ -->
      <div class="inv-tabs" id="invTabs" role="tablist" aria-label="Категории инвентаря">
        <button class="inv-tab is-active" type="button" data-inv-tab="money" aria-label="Деньги">
          <span class="inv-tab__icon inv-ico-money" aria-hidden="true"></span>
        </button>
        <button class="inv-tab" type="button" data-inv-tab="weapons" aria-label="Оружие">
          <span class="inv-tab__icon inv-ico-weapons" aria-hidden="true"></span>
        </button>
        <button class="inv-tab" type="button" data-inv-tab="armor" aria-label="Броня">
          <span class="inv-tab__icon inv-ico-armor" aria-hidden="true"></span>
        </button>
        <button class="inv-tab" type="button" data-inv-tab="accessories" aria-label="Аксессуары">
          <span class="inv-tab__icon inv-ico-accessories" aria-hidden="true"></span>
        </button>
        <button class="inv-tab" type="button" data-inv-tab="potions" aria-label="Зелья">
          <span class="inv-tab__icon inv-ico-potions" aria-hidden="true"></span>
        </button>
        <button class="inv-tab" type="button" data-inv-tab="scrolls" aria-label="Свитки">
          <span class="inv-tab__icon inv-ico-scrolls" aria-hidden="true"></span>
        </button>
        <button class="inv-tab" type="button" data-inv-tab="other" aria-label="Прочее">
          <span class="inv-tab__icon inv-ico-other" aria-hidden="true"></span>
        </button>
      </div>

      <!-- СПИСОК -->
      <div class="inv-body">
        <div class="inv-list" id="invList"></div>

        <button class="inv-add lockable" id="invAddBtn" type="button" aria-label="Добавить предмет">
          <span class="inv-add__plus" aria-hidden="true">+</span>
        </button>
      </div>
    </div>
  </div>

</section>

<!-- ВКЛАДКА: МАГИЯ -->
<!-- ВКЛАДКА: МАГИЯ -->
<section id="page-mag" class="page">
  <div class="panel lite">
    <div class="panel-b mag" id="magRoot">

      <!-- ВКЛАДКИ МАГИИ -->
      <div class="mag-tabs" id="magTabs">
        <button class="mag-tab is-active" data-mag-tab="slots" type="button">Ячейки</button>
        <button class="mag-tab" data-mag-tab="spells" type="button">Заклинания</button>
      </div>

      <!-- СТРАНИЦА: ЯЧЕЙКИ -->
      <div class="mag-page is-active" id="magPageSlots">
        <div class="mag-table" id="magSlots"></div>
      </div>

      <!-- СТРАНИЦА: ЗАКЛИНАНИЯ -->
      <div class="mag-page" id="magPageSpells">
        <div class="mag-spells-list" id="magSpellList"></div>

        <button class="inv-add lockable" id="magAddSpellBtn" type="button" aria-label="Добавить заклинание">
          <span class="inv-add__plus">+</span>
        </button>
      </div>

    </div>
  </div>
</section>
<!-- МОДАЛКА (универсальная) — ГЛОБАЛЬНО, чтобы работала во всех вкладках -->
<div class="inv-modal" id="invModal" aria-hidden="true">
  <div class="inv-modal__backdrop" data-inv-close></div>
  <div class="inv-modal__card" role="dialog" aria-modal="true" aria-labelledby="invModalTitle">
    <div class="inv-modal__title" id="invModalTitle"></div>
    <div class="inv-modal__content" id="invModalContent"></div>
    <div class="inv-modal__actions" id="invModalActions"></div>
  </div>
</div>

      </div>

      <!-- ВКЛАДКИ ВНУТРИ РАМКИ (чтобы углы снизу не пропадали) -->
      <div class="tabs inframe">
        <div class="tabbar">
          <button type="button" class="tab" data-to="page-boy" aria-selected="true">Бой</button>
          <button type="button" class="tab" data-to="page-har" aria-selected="false">Хар-ки</button>
          <button type="button" class="tab" data-to="page-inv" aria-selected="false">Инвент.</button>
          <button type="button" class="tab" data-to="page-mag" aria-selected="false">Магия</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
